<meta charset="utf-8">
<title>Canvas Record Studio · 小拍的唱片工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500&family=Caveat:wght@600&display=swap">
<style>
/* Layout: everything lives in one 16:9 frame (desk, tools, the moving track), letterboxed to fit the window. Light paper, single theme by choice. */
:root {
  --paper: #f3f0e8;
  --ink: #232323;
  --line: #d8d1c3;
  --kick: #1f1f1f;
  --pencil: #3d5a9e;
  --crayon: #d64545;
  --water: #2f9c91;
  --pal: #f08a5d;
  --f-hand: "Ma Shan Zheng", "KaiTi", "STKaiti", cursive;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: "Noto Sans SC", system-ui, sans-serif; display: grid; place-items: center; overflow: hidden; }
* { box-sizing: border-box; }
.stage { position: relative; width: min(calc(100vw - 24px), calc((100dvh - 24px) * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; touch-action: none;
  container-type: inline-size; box-shadow: 0 18px 40px -26px rgba(60,50,30,.5); }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#start { position: absolute; left: 36.25%; top: 41.3%; transform: translate(-50%, -50%); border: 2px solid var(--ink); background: #fffdf8; color: var(--ink);
  padding: .4em 1.1em; border-radius: 999px; font-family: var(--f-hand); font-size: 2cqw; cursor: pointer; box-shadow: 3px 3px 0 var(--ink); z-index: 3; }
.palette { position: absolute; left: 68.75%; right: 1%; top: 1.4%; display: flex; flex-wrap: wrap; gap: .3em; align-items: center; z-index: 2; font-size: 1.2cqw; }
.palette .sep { width: 1px; height: 1.4em; background: var(--line); margin: 0 .1em; }
.palette .br { flex-basis: 100%; height: 0; }
.pb { border: 2px solid var(--ink); background: #fffdf8; border-radius: .5em; padding: .05em .45em; cursor: pointer; font-family: var(--f-hand); font-size: 1em; line-height: 1.3;
  display: inline-flex; gap: .3em; align-items: center; box-shadow: 2px 2px 0 var(--ink); color: var(--ink); }
.pb i { width: .75em; height: .75em; border-radius: 50%; display: inline-block; border: 1.5px solid var(--ink); }
.pb[aria-pressed="true"] { background: #ffe3d2; transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--ink); }
.pb.go { background: var(--ink); color: #fffdf8; }
.pb:disabled { opacity: .4; cursor: not-allowed; }
.pb:focus-visible, #start:focus-visible { outline: 2px solid var(--pal); outline-offset: 2px; }
</style>

<div class="stage" id="stage">
  <canvas id="cv" width="1600" height="900" aria-label="Canvas Record Studio：唱机、画纸、琴键、一排会跳舞的笔，下方是跟着音乐移动的轨道"></canvas>
  <div class="palette" role="toolbar" aria-label="画画工具">
    <button class="pb" data-med="ink" aria-pressed="true" aria-label="浓墨：鼓组"><i style="background:var(--kick)"></i>墨</button>
    <button class="pb" data-med="pencil" aria-pressed="false" aria-label="铅笔：拨弦"><i style="background:var(--pencil)"></i>铅</button>
    <button class="pb" data-med="crayon" aria-pressed="false" aria-label="蜡笔：木琴"><i style="background:var(--crayon)"></i>蜡</button>
    <button class="pb" data-med="water" aria-pressed="false" aria-label="水彩：低音"><i style="background:var(--water)"></i>彩</button>
    <span class="sep"></span>
    <button class="pb" data-n="1" aria-pressed="true" aria-label="每小节一遍">×1</button>
    <button class="pb" data-n="2" aria-pressed="false" aria-label="每小节两遍">×2</button>
    <button class="pb" data-n="3" aria-pressed="false" aria-label="每小节三遍">×3</button>
    <button class="pb" data-n="4" aria-pressed="false" aria-label="每小节四遍">×4</button>
    <span class="br"></span>
    <button class="pb" id="undo" aria-label="撤销一笔">↶</button>
    <button class="pb" id="clearPad" aria-label="擦掉画纸">擦</button>
    <button class="pb go" id="drop" title="放到轨道上：下一小节开始，响 8 小节">放入轨道</button>
    <button class="pb" id="playBtn" aria-label="播放或暂停">▶</button>
    <span class="sep"></span>
    <button class="pb" id="modeBtn" aria-pressed="false" title="编辑模式：不放原曲，只循环播放你画的（16 小节）">编辑</button>
  </div>
  <button id="start">开始（打开声音）</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script>
(() => {
const TAU = Math.PI * 2, BAR = 2, STEPS = 16;
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const rc = window.rough ? rough.canvas(cv) : null;
const C = { desk: '#efe6d6', ink: '#232323', ink2: '#5f5a52', line: '#d8d1c3', kick: '#1f1f1f', pencil: '#3d5a9e', crayon: '#d64545', water: '#2f9c91', pal: '#f08a5d' };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, u) => a + (b - a) * u;
const ease = u => u * u * (3 - 2 * u);
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const PENTA = [0, 3, 5, 7, 10];
const ladder = (base, j) => base + 12 * Math.floor(j / 5) + PENTA[((j % 5) + 5) % 5];

// ================= 「节奏的形状」, note for note =================
// The original song's score and synths, unchanged, playing on the workbench's AudioContext.
const ORIG = (() => {
  const TAU = Math.PI * 2, BAR = 2, STEP = BAR / 16, STEP12 = BAR / 12;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, u) => a + (b - a) * u;
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
// ---------------- the song: 38 bars at 120 BPM ----------------
const SECTIONS = [
  { from: 0, to: 2, name: '四拍', cap: '先听最熟悉的：底鼓每拍一下。把一小节画成一圈，四个鼓点连起来，是一个正方形。' },
  { from: 2, to: 4, name: '反拍', cap: '踩镲落在两拍之间。还是正方形，只是转了 45°。House 的律动，就是两个错开的正方形。' },
  { from: 4, to: 6, name: 'Clave', cap: '3-2 Clave，拉丁音乐的骨架：一个不规则的五边形。' },
  { from: 6, to: 8, name: 'Tresillo', cap: '低音弹 3-3-2：一个三角形。很多流行和雷鬼顿的低音都是这个形状。' },
  { from: 8, to: 12, name: '3 对 4', cap: '三角形叠在正方形上：一边每小节 3 下，一边 4 下。它们只在第一拍重合。' },
  { from: 12, to: 20, name: '相位', cap: '非洲 12/8 钟声型：12 格里敲 7 下，正好是音阶的形状。右边弹同一句，每小节晚一格，七边形一格格转开，和声也跟着变。' },
  { from: 20, to: 28, name: '惠特尼', cap: '第 n 层在 4 小节里响 n 次。层一层层加进来，越来越密，但每 4 小节它们都会在同一拍重合。' },
  { from: 28, to: 36, name: 'Drop', cap: '所有层在同一拍对齐的那一刻，就是 drop。前面所有的形状一起回来。' },
  { from: 36, to: 38, name: 'Outro', cap: '最后一次对齐，所有声音落在同一个点上。' },
];
const DUR = 38 * BAR;
const CHORDS = { Am: [57, 60, 64], F: [53, 57, 60], C: [55, 60, 64], G: [55, 59, 62], Dm: [50, 57, 62] };
const PROG = ['Am', 'F', 'C', 'G'];
function chordAt(bar) {
  if (bar < 8) return 'Am';
  if (bar < 12) return bar % 2 ? 'F' : 'Am';
  if (bar < 20) return ['Am', 'Am', 'F', 'F', 'C', 'C', 'G', 'G'][bar - 12];
  if (bar < 36) return PROG[(bar - 20) % 4];
  return 'Am';
}

const EV = [], HITS = {};
const ev = (t, kind, o = {}) => { EV.push(Object.assign({ t, kind }, o)); if (o.layer) (HITS[o.layer] = HITS[o.layer] || []).push(t); };
const at = (bar, step) => bar * BAR + step * STEP;

// the 12/8 bell: 7 strokes in 12, the same spacing as a 7-note scale
const BELL = [0, 2, 4, 5, 7, 9, 11];
const MOTIF = [69, 72, 74, 76, 79, 76, 74];             // A C D E G E D — pentatonic, so every overlap is consonant

for (let b = 0; b < 38; b++) {
  const ch = chordAt(b), tones = CHORDS[ch];
  if (b < 8 || (b >= 20 && b < 27) || (b >= 28 && b < 36)) for (const s of [0, 4, 8, 12]) ev(at(b, s), 'kick', { layer: 'kick', vel: b >= 20 && b < 27 ? lerp(0.55, 0.85, (b - 20) / 7) : 0.9 });
  else if (b >= 8 && b < 20) ev(at(b, 0), 'kick', { layer: 'kick', vel: 0.55 });
  else if (b === 36) ev(at(b, 0), 'kick', { layer: 'kick', vel: 1 });
  if ((b >= 2 && b < 8) || (b >= 28 && b < 36)) for (const s of [2, 6, 10, 14]) ev(at(b, s), 'hat', { layer: 'hat', vel: 0.8 });
  if (b >= 24 && b < 28) for (let s = 0; s < 16; s++) if (s % 4 !== 2) ev(at(b, s), 'hat', { vel: lerp(0.15, 0.5, (b - 24 + s / 16) / 4) });
  if (b >= 28 && b < 36) for (let s = 1; s < 16; s += 2) ev(at(b, s), 'hat', { vel: 0.18 });
  if ((b >= 4 && b < 8) || (b >= 28 && b < 36)) for (const s of [0, 3, 6, 10, 12]) ev(at(b, s), 'clave', { layer: 'clave', vel: 0.8 });
  if (b >= 6 && b < 8) for (const s of [0, 6, 12]) ev(at(b, s), 'bass', { layer: 'bass', midi: tones[0] - 24, dur: 0.55 });
  if (b >= 28 && b < 36) { ev(at(b, 0), 'sub', { midi: tones[0] - 24, dur: 0.4 }); for (const s of [2, 6, 10, 14]) ev(at(b, s), 'bass', { layer: 'bass', midi: tones[0] - 12, dur: 0.22 }); }
  if (b >= 28 && b < 36) for (const s of [4, 12]) ev(at(b, s), 'clap', { layer: 'clap', vel: 0.85 });
  if (b >= 2 && b < 36) ev(at(b, 0), 'pad', { midis: tones, dur: BAR * 1.02, vel: b < 8 ? 0.45 : b < 20 ? 0.55 : b < 28 ? 0.7 : 0.85 });
  if (b >= 8 && b < 12) {
    const top = [tones[2] + 12, tones[1] + 12, tones[0] + 12];
    for (let k = 0; k < 3; k++) ev(b * BAR + k * BAR / 3, 'pluck', { layer: 'p3', midi: top[k], vel: 0.9, pan: -0.45 });
    for (let k = 0; k < 4; k++) ev(b * BAR + k * BAR / 4, 'bell', { layer: 'p4', midi: k % 2 ? tones[2] : tones[0], vel: 0.8, pan: 0.45 });
  }
  // phase: left voice keeps the bell; right voice plays it one twelfth later each bar
  if (b >= 12 && b < 20) {
    const shift = b - 12;
    BELL.forEach((s, j) => ev(b * BAR + s * STEP12, 'mallet', { layer: 'phA', midi: MOTIF[j], vel: 0.85, pan: -0.55 }));
    BELL.forEach((s, j) => ev(b * BAR + ((s + shift) % 12) * STEP12, 'mallet', { layer: 'phB', midi: MOTIF[j] - 12, vel: 0.75, pan: 0.55 }));
    for (let s = 0; s < 12; s++) ev(b * BAR + s * STEP12, 'shaker', { vel: s % 3 === 0 ? 0.5 : 0.25 });
    ev(at(b, 0), 'bass', { midi: tones[0] - 24, dur: 1.4 });
  }
}
ev(48, 'riser', { dur: 8 });
for (let s = 0; s < 16; s += 2) ev(at(26, s), 'clap', { vel: lerp(0.25, 0.5, s / 16) });
for (let s = 0; s < 16; s++) ev(at(27, s), 'clap', { vel: lerp(0.4, 0.9, s / 16) });
ev(56, 'impact', { shock: true });
ev(72, 'pad', { midis: [45, 57, 60, 64, 69], dur: 4, vel: 1 });
ev(72, 'impact', { soft: true, shock: true });

// Whitney: ring n sounds n times per 4-bar phrase; rings enter one per second from 40 s
const RINGS = 16, W_T0 = 40, PHRASE_LEN = 4 * BAR, W_END = 72;
const ringEnter = n => W_T0 + (n - 1) * 1.0;
const RING_HITS = Array.from({ length: RINGS + 1 }, () => []);
for (let n = 1; n <= RINGS; n++) {
  for (let ps = W_T0; ps <= W_END; ps += PHRASE_LEN) for (let k = 0; k < n; k++) {
    const t = ps + k * PHRASE_LEN / n;
    if (t < ringEnter(n) - 1e-6 || t > W_END + 1e-6) continue;
    if (t >= W_END - 1e-6 && k > 0) continue;
    const bar = Math.floor(t / BAR), tones = CHORDS[chordAt(bar)];
    const idx = n - 1, midi = tones[idx % 3] + 12 * Math.floor((idx % 9) / 3) + 12;
    ev(t, 'bell', { ring: n, midi, vel: (t >= 56 ? 0.45 : 0.75) / Math.sqrt(1 + idx * 0.25), pan: ((n % 5) - 2) * 0.25 });
    RING_HITS[n].push(t);
  }
}
const SHOCKS = EV.filter(e => e.shock).map(e => e.t);
EV.sort((a, b) => a.t - b.t);
Object.values(HITS).forEach(a => a.sort((x, y) => x - y));

// ---------------- audio ----------------
let AC = null, master, drums, music, lp, duck, verb, noise;
function initAudio(shared) {
  if (master) return;
  AC = shared;
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 3; comp.attack.value = 0.005; comp.release.value = 0.2;
  master = AC.createGain(); master.gain.value = 0.85; master.connect(comp); comp.connect(AC.destination);
  drums = AC.createGain(); drums.connect(master);
  duck = AC.createGain(); duck.connect(master);
  lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 16000; lp.Q.value = 0.7; lp.connect(duck);
  music = AC.createGain(); music.connect(lp);
  const len = AC.sampleRate * 2.6, ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let c = 0; c < 2; c++) { const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.6); }
  verb = AC.createConvolver(); verb.buffer = ir; const vg = AC.createGain(); vg.gain.value = 0.32; verb.connect(vg); vg.connect(lp);
  noise = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate); const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
const env = (g, t, peak, a, d) => { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); };
function noiseSrc(t, dur) { const s = AC.createBufferSource(); s.buffer = noise; s.start(t, Math.random()); s.stop(t + dur); return s; }
function panner(p, dest) { const n = AC.createStereoPanner(); n.pan.value = p; n.connect(dest); return n; }

const SYN = {
  kick(t, e) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.13);
    env(g, t, 0.95 * e.vel, 0.003, 0.42); o.connect(g); g.connect(drums); o.start(t); o.stop(t + 0.5);
    if (e.t >= 56 - 0.01 && e.t < 72) { duck.gain.cancelScheduledValues(t); duck.gain.setValueAtTime(0.32, t); duck.gain.linearRampToValueAtTime(1, t + 0.24); }
  },
  hat(t, e) {
    const s = noiseSrc(t, 0.08), hp = AC.createBiquadFilter(), g = AC.createGain();
    hp.type = 'highpass'; hp.frequency.value = 7500; env(g, t, 0.22 * e.vel, 0.002, 0.045);
    s.connect(hp); hp.connect(g); g.connect(panner(0.25, drums));
  },
  shaker(t, e) {
    const s = noiseSrc(t, 0.12), bp = AC.createBiquadFilter(), g = AC.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 6000; bp.Q.value = 1.2; env(g, t, 0.09 * e.vel, 0.01, 0.07);
    s.connect(bp); bp.connect(g); g.connect(panner(-0.15, drums));
  },
  clap(t, e) {
    const s = noiseSrc(t, 0.25), bp = AC.createBiquadFilter(), g = AC.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 1700; bp.Q.value = 0.9; env(g, t, 0.5 * e.vel, 0.003, 0.17);
    s.connect(bp); bp.connect(g); g.connect(drums); g.connect(verb);
  },
  clave(t, e) {
    [[2200, 0.28], [1450, 0.16]].forEach(([f, a]) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = f; env(g, t, a * e.vel, 0.001, 0.07); o.connect(g); g.connect(panner(-0.3, drums)); o.start(t); o.stop(t + 0.1); });
  },
  bass(t, e) {
    const g = AC.createGain(), f = AC.createBiquadFilter(), end = t + e.dur + 0.4;
    f.type = 'lowpass'; f.Q.value = 0.9; f.frequency.setValueAtTime(1100, t); f.frequency.exponentialRampToValueAtTime(180, t + Math.min(0.25, e.dur));
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.46, t + 0.008); g.gain.setTargetAtTime(0.0001, t + e.dur * 0.65, 0.05);
    [['triangle', 0.75], ['sawtooth', 0.3], ['sine', 0.5]].forEach(([type, amp]) => { const o = AC.createOscillator(), og = AC.createGain(); o.type = type; o.frequency.value = mtof(e.midi); og.gain.value = amp; o.connect(og); og.connect(f); o.start(t); o.stop(end); });
    f.connect(g); g.connect(music);
  },
  sub(t, e) { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = mtof(e.midi); env(g, t, 0.35, 0.01, e.dur); o.connect(g); g.connect(music); o.start(t); o.stop(t + e.dur + 0.1); },
  pluck(t, e) {
    const g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2;
    f.frequency.setValueAtTime(4200, t); f.frequency.exponentialRampToValueAtTime(600, t + 0.3);
    env(g, t, 0.13 * e.vel, 0.004, 0.55);
    [-7, 7].forEach(d => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(e.midi); o.detune.value = d; o.connect(f); o.start(t); o.stop(t + 0.7); });
    f.connect(g); const p = panner(e.pan || 0, music); g.connect(p); g.connect(verb);
  },
  // a soft marimba: sine body + a quick 4th harmonic + the 10th for the wooden knock
  mallet(t, e) {
    const g = AC.createGain(); env(g, t, 0.2 * e.vel, 0.002, 0.5);
    [[1, 1], [4, 0.18], [10, 0.04]].forEach(([m, a]) => { const o = AC.createOscillator(), og = AC.createGain(); o.frequency.value = mtof(e.midi) * m; og.gain.value = a;
      if (m > 1) { og.gain.setValueAtTime(a, t); og.gain.exponentialRampToValueAtTime(0.0001, t + 0.12); }
      o.connect(og); og.connect(g); o.start(t); o.stop(t + 0.6); });
    const p = panner(e.pan || 0, music); g.connect(p); g.connect(verb);
  },
  bell(t, e) {
    const g = AC.createGain(); env(g, t, 0.16 * e.vel, 0.003, 1.1);
    [[1, 1], [2, 0.25], [3.01, 0.1]].forEach(([m, a]) => { const o = AC.createOscillator(), og = AC.createGain(); o.frequency.value = mtof(e.midi) * m; og.gain.value = a; o.connect(og); og.connect(g); o.start(t); o.stop(t + 1.2); });
    const p = panner(e.pan || 0, music); g.connect(p); g.connect(verb);
  },
  pad(t, e) {
    const g = AC.createGain(), f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1100;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.05 * e.vel, t + 0.25); g.gain.setTargetAtTime(0.0001, t + e.dur - 0.1, 0.25);
    e.midis.forEach(m => [-9, 0, 9].forEach(d => { const o = AC.createOscillator(); o.type = 'sawtooth'; o.frequency.value = mtof(m - 12); o.detune.value = d; o.connect(f); o.start(t); o.stop(t + e.dur + 1.2); }));
    f.connect(g); g.connect(music); g.connect(verb);
  },
  riser(t, e) {
    const s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noise; s.loop = true; s.start(t); s.stop(t + e.dur);
    bp.type = 'bandpass'; bp.Q.value = 3; bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(7000, t + e.dur);
    g.gain.setValueAtTime(0.005, t); g.gain.exponentialRampToValueAtTime(0.16, t + e.dur - 0.05); g.gain.linearRampToValueAtTime(0, t + e.dur);
    s.connect(bp); bp.connect(g); g.connect(drums);
  },
  impact(t, e) {
    const s = AC.createBufferSource(), hp = AC.createBiquadFilter(), g = AC.createGain();
    s.buffer = noise; s.loop = true; s.start(t); s.stop(t + 2);
    hp.type = 'highpass'; hp.frequency.value = 2500; env(g, t, e.soft ? 0.08 : 0.22, 0.004, 1.6);
    s.connect(hp); hp.connect(g); g.connect(drums); g.connect(verb);
    const o = AC.createOscillator(), og = AC.createGain(); o.frequency.setValueAtTime(70, t); o.frequency.exponentialRampToValueAtTime(38, t + 1.2);

  rc.circle(870, 92, 64, { fill: '#cbc3b5', fillStyle: 'solid', stroke: C.ink, roughness: 1.2, seed: sd(30) });
  rc.linearPath([[870, 92], [690, 76], [598, 88]], { stroke: C.ink, strokeWidth: 6, roughness: 0.8, seed: sd(31) });
  rc.rectangle(566, 76, 30, 24, { fill: C.ink, fillStyle: 'solid', stroke: C.ink, roughness: 1, seed: sd(32) });

  // the speaker breathes with the kick; keys light with each pitch
  let kickAge = 9; for (let i = recent.length - 1; i >= 0; i--) if (recent[i].kind === 'kick') { kickAge = t - recent[i].t; break; }
  const boom = Math.exp(-kickAge / 0.1);
  for (const y of [168, 458]) rc.circle(120, y, 60 + 18 * boom, { stroke: C.ink, strokeWidth: 2, roughness: 1.4, seed: sd(42 + y) });
  const WHITE = [57, 59, 60, 62, 64, 65, 67, 69, 71, 72, 74, 76, 77, 79, 81], kw = 468 / 15;
  WHITE.forEach((m, i) => {
    let lit = 0, col = null;
    for (const f of recent) { if (f.midi == null) continue; let mm = f.midi; while (mm < 57) mm += 12; while (mm > 81) mm -= 12; if (mm === m) { const v = Math.exp(-(t - f.t) / 0.25); if (v > lit) { lit = v; col = f.color; } } }
    rc.rectangle(1106 + i * kw, 598, kw - 4, 96, { fill: lit > 0.05 ? col : '#fbfaf5', fillStyle: lit > 0.05 ? 'hachure' : 'solid', hachureGap: 4, stroke: C.ink, strokeWidth: 1.2, roughness: 1, seed: sd(50 + i) });
  });

  // the paper: your strokes, or 小拍 drawing the original's next layer when the paper is empty
  const all = strokes.concat(drawing ? [{ med, pts: drawing }] : []);
  const userPen = !!drawing || wallNow() - ptrT < 1500;
  const nd = all.length || userPen ? null : nextOrigDrawing(t);
  let jobs = [];
  if (nd && nd.items[0].kind === 'whitney') { const tip = drawWhitney(t, nd.items[0]); if (tip) jobs.push({ k: 'pencil', aim: tip, press: 0.85 }); }
  else if (nd) jobs = drawLayers(t, nd).map(j => ({ k: j.m, aim: j.tip, press: 0.85 }));
  const er = (wallNow() - eraseAt) / 800;
  if (er >= 1 && eraseAt > 0) { strokes = []; offSteps.clear(); eraseAt = -1e9; }
  ctx.save(); if (er >= 0 && er < 1) ctx.globalAlpha = 1 - ease(er);
  for (const [q, s] of all.entries()) if (s.pts.length > 1) rc.linearPath(s.pts, Object.assign({ seed: sd(300 + q) }, STYLE[s.med]));
  else if (s.pts.length === 1) mark(s.med, s.pts[0][0], s.pts[0][1], 300 + q, 0);
  ctx.restore();
  const snaps = snapped(), m0 = all.length ? all[all.length - 1].med : med;
  // the notes your drawing will play: the shape they make, and a mark on each
  const NP = snaps.map(notePos);
  if (NP.length > 1) { ctx.save(); ctx.globalAlpha = 0.5; rc.polygon(NP, { stroke: MED[m0].color, strokeWidth: 1.4, strokeLineDash: [5, 6], roughness: 1, seed: sd(398) }); ctx.restore(); }
  NP.forEach((p, j) => mark(m0, p[0], p[1], 400 + snaps[j].step, 0.35));
  dropBtn.disabled = !snaps.length;
  if (!nd && all.length) paperNote(`${MED[m0].name} ×${mult} · ${snaps.length} 个音 · 点一下音符可去掉`);
  else if (!nd && (userPen || freeMode)) paperNote('角度是时间，越往外越高 · 只在拐角和点按处发声');
  else if (!nd && !freeMode && t >= DROP_T && t < DROP_T + 4) paperNote('Drop：前面的形状全部回来了！');
  else if (!nd && !freeMode && t >= 72) paperNote('Outro：所有的圈对齐，最后一个和弦');

  const sec = ORIG.SECTIONS.find(x => bar >= x.from && bar < x.to) || ORIG.SECTIONS[ORIG.SECTIONS.length - 1];
  ctx.font = '32px "Ma Shan Zheng", KaiTi, serif'; ctx.fillStyle = C.ink; ctx.textAlign = 'left'; ctx.fillText(freeMode ? '编辑模式' : t < 0 ? '准备……' : t >= DROP_T - 2 * BAR && t < DROP_T ? '马上 Drop！' : sec.name, 408, 710);
  const tt = Math.max(0, t), mm = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  ctx.font = '600 28px Caveat, cursive'; ctx.fillStyle = C.ink2; ctx.textAlign = 'right'; ctx.fillText(`${mm(tt)} / ${mm(loopEnd())}`, 904, 710);

  drawTrack(t);
  drawTip(t);

  // the band: every pen hops on each beat, landing on the ruler on the beat, alternately left and right, higher when its own instrument plays;
  // the pen whose medium is needed flies over and draws with its tip (your pen follows your hand; the eraser scrubs when you clear)
  const pn = wallNow(), dt = Math.min(0.1, (pn - lastFrame) / 1000); lastFrame = pn;
  const beat = BAR / 4, bt = playing ? t + 10 : pn / 1000, ph = ((bt / beat) % 1 + 1) % 1, side = Math.floor(bt / beat) % 2 ? -1 : 1;
  if (er >= 0 && er < 1) jobs = [{ k: 'eraser', aim: [PAD.x + 110 * Math.sin(er * TAU * 2.5), PAD.y + 50 * Math.sin(er * TAU * 1.3)], press: 1 }];
  else if (userPen && ptr) jobs = [{ k: med, aim: ptr, press: drawing ? 1 : 0 }];
  const dropKick = !freeMode && t >= DROP_T && t < DROP_T + 0.8 ? Math.sin(Math.PI * (t - DROP_T) / 0.8) : 0;
  const poses = BUDS.map((b, i) => {
    const P = PEN[b.k], job = jobs.find(j => j.k === b.k), goal = job ? 1 : 0;
    P.e = clamp(P.e + Math.sign(goal - P.e) * dt / 0.45, 0, 1);
    if (job) { P.tx = job.aim[0]; P.ty = job.aim[1]; }
    let age = 9;
    if (b.k !== 'eraser') for (let q = recent.length - 1; q >= 0; q--) if (recent[q].color === MED[b.k].color) { age = t - recent[q].t; break; }
    const poke = Math.exp(-(pn - (b.poke || -1e9)) / 250), mine = Math.exp(-age / 0.25);
    const hop = ((playing ? 16 + 18 * mine : 0) + 24 * poke) * Math.sin(Math.PI * ph) + 46 * dropKick;   // everyone leaps at the drop
    const dx = playing ? 7 * lerp(side, -side, ease(ph)) : 0;
    const thS = playing ? -0.16 * side * Math.sin(Math.PI * ph) : 0.04 * Math.sin(pn / 600 + i);
    const H = b.H * BUD_S, bx = b.x + dx, by = TRAY_Y - hop;
    const S = { ax: bx + H * Math.sin(thS), ay: by - H * Math.cos(thS), th: thS };
    const D = { ax: P.tx, ay: P.ty - 12 * (1 - (job ? job.press : 0)), th: b.k === 'eraser' ? 0.22 * Math.sin(pn / 45) : Math.PI - 0.45 };
    const e = ease(P.e);
    return { b, i, e, open: clamp(mine + poke, 0, 1), swing: playing ? side * (1 - 2 * ph) : 0,
      pose: { ax: lerp(S.ax, D.ax, e), ay: lerp(S.ay, D.ay, e) - Math.sin(Math.PI * e) * 110, th: lerp(S.th, D.th, e) } };
  });
  const sel = poses.find(p => p.b.k === med);
  if (sel && sel.e < 0.5) rc.ellipse(sel.b.x, TRAY_Y + 1, 40, 10, { fill: C.pal, fillStyle: 'hachure', hachureGap: 2.5, stroke: 'none', roughness: 1.4, seed: sd(1030) });
  poses.sort((a, c) => a.e - c.e).forEach(p => {
    if (p.e > 0.5) { ctx.save(); ctx.globalAlpha = 0.25 * p.e; ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(PEN[p.b.k].tx + 6, PEN[p.b.k].ty + 3, 11, 4, 0, 0, TAU); ctx.fill(); ctx.restore(); }
    drawBud(p.b, p.i, bt, p.pose, p.open, p.swing);
  });
  ctx.save(); ctx.font = '600 32px Caveat, cursive'; ctx.textAlign = 'center';
  recent.slice(-8).forEach((f, q) => { const u = (t - f.t) / 1.2; ctx.globalAlpha = 1 - u; ctx.fillStyle = f.color; ctx.fillText(q % 3 ? '♪' : '♫', 790 + Math.sin(f.t * 7) * 40 + 30 * u, 74 - 50 * u); });
  ctx.restore();
}

requestAnimationFrame(frame);

if (RENDER) {
  document.querySelector('.palette').hidden = true; document.getElementById('start').hidden = true;
  // load every glyph the canvas will write before the first frame, then redraw the cached desk text
  window.renderReady = async () => {
    const cjk = [...new Set([...[...document.scripts].map(x => x.textContent).join('')].filter(ch => ch > '\u2000'))].join('');
    await Promise.all([document.fonts.load('600 40px Caveat', 'Canvas Record Studio 0123456789×DROP!'), document.fonts.load('20px "Ma Shan Zheng"', cjk)]);
    await document.fonts.ready; TEXT = null; for (const k in DESK) delete DESK[k];
    return true;
  };
  window.renderAt = (t, wallMs, quality = 0.92) => { playing = true; vclock = t; vwall = wallMs; frame(); return cv.toDataURL('image/jpeg', quality); };
  // the original song, rendered offline from the count-in to the last chord, as a 16-bit stereo WAV in base64
  window.renderAudio = async () => {
    const sr = 44100, len = Math.ceil((PRE + DUR + 1.5) * sr), off = new OfflineAudioContext(2, len, sr);
    let vt = 0;
    const ctxProxy = new Proxy(off, { get: (o, k) => (k === 'currentTime' ? vt : typeof o[k] === 'function' ? o[k].bind(o) : o[k]) });
    ORIG.init(ctxProxy); ORIG.seek(-PRE);
    for (let x = -PRE; x < DUR + 0.3; x += 0.05) { vt = PRE + Math.max(0, x); ORIG.tick(x, PRE); }
    const buf = await off.startRendering(), n = buf.length, L = buf.getChannelData(0), Rch = buf.getChannelData(1);
    const out = new DataView(new ArrayBuffer(44 + n * 4)), str = (o, v) => [...v].forEach((c, i) => out.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); str(8, 'WAVE'); str(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
    out.setUint32(24, sr, true); out.setUint32(28, sr * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); str(36, 'data'); out.setUint32(40, n * 4, true);
    let peak = 0; for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(Rch[i]));
    const gain = Math.min(1, 0.93 / (peak || 1));                    // leave a little headroom instead of clipping
    for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, clamp(L[i] * gain, -1, 1) * 32767, true); out.setInt16(46 + i * 4, clamp(Rch[i] * gain, -1, 1) * 32767, true); }
    const bytes = new Uint8Array(out.buffer); let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  window.renderSpan = { from: -PRE, to: DUR };
}
})();
</script>
